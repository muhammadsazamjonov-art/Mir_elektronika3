<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mir Electronika</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap"><style>
:root{--bg:#050b14;--ink:#e8f1f8;--mut:#8da2b5;--card:rgba(10,24,38,.7);--line:rgba(34,211,238,.22);--pc:#22d3ee;--hot:#22d3ee;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 500px at 70% 0,rgba(14,116,144,.25),transparent),var(--bg);color:var(--ink);font:16px/1.55 "Space Grotesk",system-ui,sans-serif;min-height:100vh}
.mono,.ey{font-family:"Space Mono","Courier New",monospace;letter-spacing:.2em;font-size:12px;color:var(--mut);text-transform:uppercase}
header{position:sticky;top:0;z-index:5;background:rgba(5,11,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header .w{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}.lg{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:rgba(34,211,238,.08)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a,.nav button,.pill{color:var(--ink);background:rgba(10,24,38,.8);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer}
.cur{display:flex;border:1px solid var(--line);border-radius:20px;padding:2px}.cur button{border:0;border-radius:18px;font-size:12px;padding:6px 10px;font-family:"Space Mono",monospace;background:none;color:var(--mut)}.cur button.on{background:rgba(34,211,238,.18);color:var(--pc)}
.w{max-width:1100px;margin:0 auto;padding:0 16px}
h1{margin:0;font-size:18px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.05;font-weight:700;letter-spacing:-1px;margin:14px 0 18px}
h2{margin:18px 0 8px;font-size:clamp(24px,4vw,34px)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:56px 0 40px}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:32px}}
.hero p{color:#c3d3e0;font-size:18px;max-width:520px}.hero b{color:#fff}
.cta{margin-top:20px;padding:12px 22px;border:0;border-radius:12px;background:var(--pc);color:#032530;font:700 16px inherit;box-shadow:0 0 28px rgba(34,211,238,.4);cursor:pointer}
.stats{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}.st{border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:120px;background:var(--card)}.st b{display:block;font-size:22px}.st span{font-size:13px;color:var(--mut)}
.vis{position:relative;border:1px solid var(--line);border-radius:22px;background:#02060c;aspect-ratio:4/3.2;display:grid;place-items:center;box-shadow:0 0 60px rgba(34,211,238,.12)}
.vis svg{width:78%;height:auto}
.fb{position:absolute;background:rgba(5,14,24,.92);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:13px}.fb small{display:block;font:12px "Space Mono",monospace;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:50px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.pill.on{background:rgba(34,211,238,.15);border-color:var(--pc);color:var(--pc)}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(2,8,14,.8);color:var(--ink);font:inherit;width:100%}
.bar{margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:16px 0 100px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:flex;align-items:flex-end;padding:10px 14px;background:linear-gradient(135deg,#0b2a3c,#04101b);color:var(--pc);font:700 13px "Space Mono",monospace;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.b{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.b h3{margin:0;font-size:18px}.b small{color:var(--mut);font-family:"Space Mono",monospace;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}.pr{font-weight:700;font-size:18px;color:#fff}
.add,.btn{padding:8px 14px;border:0;border-radius:10px;background:var(--pc);color:#032530;font-weight:700;cursor:pointer}.btn.g{background:var(--pc)}.btn.r{background:#e5484d;color:#fff}.btn:not(.g):not(.r){background:rgba(34,211,238,.15);color:var(--pc)}
button{font:inherit}
#cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(5,14,24,.95);border:1px solid var(--pc);border-radius:16px;padding:12px 0;box-shadow:0 0 30px rgba(34,211,238,.25)}
#cart .w{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#cart a{background:var(--pc);color:#032530;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}.f label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td img{width:44px;height:44px;object-fit:cover;border-radius:8px}.msg{color:#fbbf24;font-weight:600}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}

button,.btn,.add,.cta,.pill,.nav a,#cart a,.hb{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border:1px solid var(--pc);border-radius:12px;background:var(--pc);color:#032530;font:700 13px/1.2 "Space Grotesk",system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:none}
.nav a,.nav button,.cur button,.pill,.tabs button{background:transparent;color:var(--pc);border:1px solid var(--pc);border-radius:12px;padding:6px 12px;font-size:13px;font-family:"Space Grotesk",system-ui,sans-serif}
.pill.on,.tabs button.on,.cur button.on,.nav button.on{background:var(--pc);color:#032530}
.btn:not(.g):not(.r),.btn.r,.btn.g{background:var(--pc);color:#032530}
.cur{display:flex;gap:8px;border:0;padding:0;border-radius:0}
.hb2{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hb2 .cta{margin-top:0}
.hb{background:transparent;color:var(--pc)}
.sim{margin-top:50px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.sim h2{margin:6px 0}.sim p{margin:0;color:var(--mut);max-width:560px}
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;padding:0;border-radius:50%;z-index:30;box-shadow:0 0 24px rgba(34,211,238,.45)}
#ap{position:fixed;right:16px;bottom:calc(148px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(480px,60vh);z-index:30;display:flex;flex-direction:column;background:#06111c;border:1px solid var(--pc);border-radius:16px;box-shadow:0 0 40px rgba(34,211,238,.25);overflow:hidden}
#ap .ah{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
#ap .ah button{padding:2px 10px}
#am{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mg{max-width:88%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.mg.user{align-self:flex-end;background:rgba(34,211,238,.18)}.mg.assistant{align-self:flex-start;border:1px solid var(--line)}.mut{color:var(--mut);font-size:14px}
#ap .af{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.nav{gap:6px}.cur{gap:6px}

.mono2{font-family:"Space Mono",monospace;color:var(--pc);font-size:14px}

.bd{position:fixed;inset:0;background:rgba(2,6,12,.7);backdrop-filter:blur(6px);z-index:40}

.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.dr .hd{padding:18px 20px}
.ls{flex:1;overflow-y:auto;padding:0 20px 12px;display:flex;flex-direction:column;gap:12px}
.ci{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.ci .th{width:64px;height:64px;border-radius:10px;background:#0b2a3c center/cover;flex:none;display:grid;place-items:center;color:var(--pc);font:700 11px "Space Mono",monospace}
.ci .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.qr{display:flex;align-items:center;gap:10px}.qb{padding:2px 10px}
.ft{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pr2{display:flex;gap:8px}.sr{display:flex;justify-content:space-between;font-family:"Space Mono",monospace}.sr.tt{font-size:18px}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#07121d;border:1px solid var(--line);border-radius:20px;padding:20px;z-index:42;display:flex;flex-direction:column;gap:10px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}.og .pill{width:100%;padding:12px}
.tot{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.tot b{color:var(--pc);font-size:22px}
#fab{bottom:calc(20px + env(safe-area-inset-bottom,0px))}#ap{bottom:calc(156px + env(safe-area-inset-bottom,0px))}
#call{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;z-index:30;display:grid;place-items:center;background:var(--pc);border:1px solid var(--pc);box-shadow:0 0 24px rgba(34,211,238,.45)}

@media(max-width:360px){.grid{grid-template-columns:1fr}}

function sums(){var sub=0,L=[];for(var i in cart){if(!D.p[i]||!(cart[i]>0))continue;sub+=cart[i]*D.p[i].pr;L.push(D.p[i].n+' ['+D.p[i].code+'] x'+cart[i]+' = '+fmt(cart[i]*D.p[i].pr))}
var dc=promo?Math.round(sub*promo.pct/100):0;return{sub:sub,dc:dc,tot:sub-dc,L:L}}
function cartDraw(){
if(!cOpen&&!kOpen&&!ok){cw.innerHTML='';return}
var S=sums(),keys=Object.keys(cart).filter(function(i){return D.p[i]&&cart[i]>0}),h="<div class='bd' id='bd'></div>";
if(cOpen){h+="<aside class='dr'><div class='hd'><div><h2 style='margin:0'>Savat</h2><div class='mut'>Buyurtmani rasmiylashtirib, to'lov usulini tanlang</div></div><button id='cx' aria-label='Yopish'>×</button></div><div class='ls'>";
h+=keys.length?keys.map(function(i){var p=D.p[i];return "<div class='ci'><div class='th'"+(p.img?" style='background-image:url("+p.img+")'":'')+">"+(p.img?'':esc(p.code))+"</div><div class='m'><b>"+esc(p.n)+"</b><div class='mono2'>"+fmt(p.pr)+" × "+cart[i]+"</div><div class='qr'><button class='qb' data-q='-"+i+"'>−</button><span>"+cart[i]+"</span><button class='qb' data-q='+"+i+"'>+</button><button class='qb' data-q='x"+i+"' style='margin-left:auto'>O'chirish</button></div></div></div>"}).join(''):"<p class='mut'>Savat hozircha bo'sh.</p>";
h+="</div><div class='ft'><div class='pr2'><input id='pin' placeholder='Promokod' value='"+esc(pin)+"'><button id='pap'>Qo'llash</button></div>"+(pmsg?"<div class='mut'>"+esc(pmsg)+"</div>":'')+"<div class='sr'><span>Oraliq summa</span><span>"+fmt(S.sub)+"</span></div>"+(S.dc?"<div class='sr'><span>Chegirma ("+esc(promo.c)+" −"+promo.pct+"%)</span><span>−"+fmt(S.dc)+"</span></div>":'')+"<div class='sr tt'><b>Jami</b><b>"+fmt(S.tot)+"</b></div><button id='co' class='wide'"+(keys.length?'':' disabled')+">Xaridni rasmiylashtirish</button></div></aside>"}
if(kOpen){var pays=['Payme','Click','Uzum Bank','Karta orqali'];
h+="<div class='md'><div class='hd'><div><h2 style='margin:0'>Yetkazib berish va to'lov</h2><div class='mut'>Ma'lumotlarni to'ldiring — to'lov simulyatsiya rejimida</div></div><button id='kx' aria-label='Yopish'>×</button></div>"
+"<input id='kn' placeholder='Ismingiz' value='"+esc(ck.n)+"'><input id='kp' placeholder='Telefon (+998 ...)' inputmode='tel' value='"+esc(ck.p)+"'><input id='ka' placeholder='Manzil' value='"+esc(ck.a)+"'><input id='kz' placeholder='Izoh (ixtiyoriy)' value='"+esc(ck.z)+"'>"
+"<div class='ey'>To'lov usuli</div><div class='og'>"+pays.map(function(x){return "<button class='pill"+(ck.pay==x?" on":"")+"' data-pay='"+x+"'>"+x+"</button>"}).join('')+"</div>"
+(ck.pay=='Karta orqali'?"<div class='box'>"+(D.card?"Kartaga o'tkazing: <b class='mono2'>"+cnum(D.card)+"</b>"+(D.holder?"<div class='mut'>"+esc(D.holder)+"</div>":''):"<span class='mut'>Karta raqami hali kiritilmagan.</span>")+"</div>":'')
+"<div class='tot'><span>Jami to'lov</span><b>"+fmt(S.tot)+"</b></div>"+(kerr?"<div class='msg'>"+esc(kerr)+"</div>":'')+"<button id='kc' class='wide'>Buyurtmani tasdiqlash</button><div class='mut' style='text-align:center'>Ism, telefon va manzil — majburiy</div></div>"}
if(ok){h+="<div class='md'><div class='hd'><h2 style='margin:0'>Buyurtma #"+ok.id+" qabul qilindi</h2><button id='ox' aria-label='Yopish'>×</button></div><p>To'lov usuli: <b>"+esc(ok.pay)+"</b>. Jami: <b>"+fmt(ok.tot)+"</b></p>"+(ok.pay=='Karta orqali'&&D.card?"<div class='box'>Kartaga o'tkazing: <b class='mono2'>"+cnum(D.card)+"</b>"+(D.holder?"<div class='mut'>"+esc(D.holder)+"</div>":'')+"</div>":"<p class='mut'>To'lov simulyatsiya rejimida — pul yechilmaydi.</p>")+"<p>Buyurtmani sotuvchiga yuborish uchun tugmani bosing:</p><a class='hb wide' target='_blank' rel='noopener' href='https://t.me/"+esc(D.tg)+"?text="+encodeURIComponent(ok.text).replace(/'/g,'%27')+"'>Telegramda yuborish</a></div>"}
cw.innerHTML=tr(h);var g=function(i){return document.getElementById(i)};
g('bd').onclick=function(){if(ok)return;cOpen=false;kOpen=false;cartDraw()};
if(g('cx'))g('cx').onclick=function(){cOpen=false;cartDraw()};
cw.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){var q=b.dataset.q,k=q.slice(1);if(q[0]=='+')cart[k]++;else if(q[0]=='-')cart[k]--;else cart[k]=0;if(!(cart[k]>0))delete cart[k];rd();cartDraw()}});
if(g('pin'))g('pin').oninput=function(){pin=this.value};
if(g('pap'))g('pap').onclick=function(){var c=pin.trim().toUpperCase(),f=D.promo.filter(function(x){return String(x.c).toUpperCase()==c})[0];if(f){promo=f;pmsg="Promokod qo'llandi: −"+f.pct+"%"}else{promo=null;pmsg=c?"Bunday promokod topilmadi":"Promokodni kiriting"}cartDraw()};
if(g('co'))g('co').onclick=function(){cOpen=false;kOpen=true;kerr='';cartDraw()};
if(g('kx'))g('kx').onclick=function(){kOpen=false;cOpen=true;cartDraw()};
[['kn','n'],['kp','p'],['ka','a'],['kz','z']].forEach(function(x){var e=g(x[0]);if(e)e.oninput=function(){ck[x[1]]=this.value}});
cw.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){ck.pay=b.dataset.pay;cartDraw()}});
if(g('kc'))g('kc').onclick=function(){if(!ck.n.trim()||!ck.p.trim()||!ck.a.trim()){kerr='Ism, telefon va manzil majburiy.';return cartDraw()}
var S=sums(),id=Math.floor(10000+Math.random()*90000),t='Yangi buyurtma #'+id+'\n'+S.L.join('\n')+'\nOraliq: '+fmt(S.sub)+(S.dc?'\nPromokod '+promo.c+': -'+fmt(S.dc):'')+'\nJami: '+fmt(S.tot)+"\nTo'lov: "+ck.pay+'\nIsm: '+ck.n+'\nTel: '+ck.p+'\nManzil: '+ck.a+(ck.z?'\nIzoh: '+ck.z:'');
ok={id:id,pay:ck.pay,tot:S.tot,text:t};kOpen=false;kerr='';cartDraw()};
if(g('ox'))g('ox').onclick=function(){ok=null;cart={};promo=null;pin='';pmsg='';rd();cartDraw()}}
function draw(){location.hash=='#admin'?adm():shop()}

var aiw=document.createElement('div');document.body.appendChild(aiw);
var chat=[],aiOpen=false,busy=false,smp=null;
if(window.claude&&claude.use)claude.use('sample').then(function(x){smp=x;aiBuild()},function(){});
function aiBuild(){if(!smp){aiw.innerHTML='';return}
aiw.innerHTML='<button id="fab" aria-label="AI yordamchi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#032530" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg></button>'+(aiOpen?'<div id="ap"><div class="ah"><span>Robo AI maslahatchi</span><button id="ax" aria-label="Yopish">×</button></div><div id="am"></div><div class="af"><input id="ai" placeholder="Savolingizni yozing..."><button id="as">Yuborish</button></div></div>':'');
aiw.innerHTML=tr(aiw.innerHTML);document.getElementById('fab').onclick=function(){aiOpen=!aiOpen;aiBuild()};
if(aiOpen){document.getElementById('ax').onclick=function(){aiOpen=false;aiBuild()};document.getElementById('as').onclick=aiSend;document.getElementById('ai').onkeydown=function(e){if(e.key=='Enter')aiSend()};aiMsgs()}}
function aiMsgs(){var m=document.getElementById('am');if(!m)return;
m.innerHTML=(chat.length?'':'<p class="mut">'+T("Salom! Elektronika, ESP32, Arduino, servo yoki istalgan mavzu bo'yicha so'rang.")+'</p>')+chat.map(function(x){return'<div class="mg '+x.r+'">'+esc(x.c||'...')+'</div>'}).join('');m.scrollTop=m.scrollHeight}
async function aiSend(){var i=document.getElementById('ai'),t=i.value.trim();if(!t||busy||!smp)return;i.value='';
chat.push({r:'user',c:t});var bot={r:'assistant',c:''};chat.push(bot);busy=true;aiMsgs();
var info=D.p.map(function(p){return p.code+' '+p.n+' ('+p.c+') '+p.pr+" so'm"}).join('; ');
var turns=chat.slice(0,-1).map(function(x){return{role:x.r,content:x.c}});
turns[0].content="Sen Mir Electronika do'konining AI yordamchisisan. Har qanday savolga foydalanuvchi yozgan tilda (asosan o'zbekcha) aniq va qisqa javob ber. Do'kondagi mahsulotlar: "+info+"\n\nFoydalanuvchi savoli: "+turns[0].content;
try{var r=await smp(turns,{cache:false,onText:function(o){bot.c=o.text;aiMsgs()}});bot.c=r.text}
catch(e){bot.c=e&&e.code=='not_granted'?'AI uchun ruxsat berilmadi.':e&&e.code=='rate_limited'?'Juda tez, biroz kuting.':"Xatolik. Qayta urinib ko'ring."}
busy=false;aiMsgs()}
window.onhashchange=function(){note='';draw()};draw();
</script></body></html>
